# 每次 push 或開 Pull Request 時，GitHub 會自動跑一次全部測試
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run   # 改了 Model 忘記做 migration 會在這裡被抓到
      - run: python manage.py test
