{% extends "base.html" %}
{% block title %}修改密碼{% endblock %}
{% block content %}
<a class="back" href="{% url 'accounts:settings' %}">‹ 帳號設定</a>
<h1>修改密碼</h1>
<form method="post" class="card" novalidate>
  {% csrf_token %}
  {% for f in form %}
  <div class="field">
    <label for="{{ f.id_for_label }}">{{ f.label }}</label>{{ f }}{{ f.errors }}
    {% if f.name == 'new_password1' %}<div class="help">至少 6 個字元，不要太常見、不要和帳號太像</div>{% endif %}
  </div>
  {% endfor %}
  <button class="btn btn-block" type="submit">更新密碼</button>
</form>
{% endblock %}
